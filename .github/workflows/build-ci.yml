name: TEST ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SDK_NAME: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
  SDK_TAR:  immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  SDK_URL:  https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  ARCH:     arm_cortex-a9_vfpv3-d16

jobs:

  # ======================= CHECK UPSTREAM SHA ================================
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      # Cache restore MUST come before the step that reads .last_built_sha
      - name: Restore last built SHA cache
        uses: actions/cache@v4
        with:
          path: .last_built_sha
          key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
          restore-keys: |
            qmodem-last-built-sha-24.10.4-

      - name: Check latest upstream commit
        id: check
        run: |
          UPSTREAM_REPO="FUjr/QModem"
          API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
          LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
          LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
          FORCE="${{ github.event.inputs.force_rebuild }}"

          echo "Latest upstream SHA : $LATEST_SHA"
          echo "Last built SHA      : $LAST_BUILT_SHA"
          echo "Force rebuild       : $FORCE"

          if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
            echo "New commits detected — build triggered."
            echo "build_needed=true"        >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .last_built_sha
          elif [ "$FORCE" = "true" ]; then
            echo "No new commits, but force_rebuild=true — build triggered anyway."
            echo "build_needed=true"        >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .last_built_sha
          else
            echo "No new commits and force_rebuild=false — skipping build."
            echo "build_needed=false"       >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          fi

  # ======================= UNIFIED BUILD JOB =================================
  build-all:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:

      # ── Checkout all sources ──────────────────────────────────────────────
      - name: Checkout QModem source
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-source
          ref: main

      - name: Checkout quectel-timesync
        uses: actions/checkout@v4
        with:
          repository: sevvian/quectel-timesync
          path: quectel-source
          ref: master

      - name: Checkout mrhaav packages
        uses: actions/checkout@v4
        with:
          repository: mrhaav/openwrt-packages
          path: mrhaav-source
          ref: main
          sparse-checkout: |
            atc-fib-fm350_gl
            luci/protocols/luci-proto-atc

      - name: Checkout Argon theme
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-theme-argon
          path: argon-theme-source
          ref: master

      - name: Checkout Argon config
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-app-argon-config
          path: argon-config-source
          ref: master

      # ── Build dependencies ────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd libcap-dev

      # ── SDK (cached) ──────────────────────────────────────────────────────
      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v4

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"

      # ── Prepare feed directories for mrhaav and argon ────────────────────
      # Each src-link feed directory must contain one sub-directory per package.
      # quectel-timesync goes directly into SDK package/ (not a feed).
      - name: Create feed directory structures
        run: |
          # mrhaav: one sub-directory per package inside mrhaavfeed/
          mkdir -p mrhaavfeed/atc-fib-fm350_gl
          mkdir -p mrhaavfeed/luci-proto-atc
          cp -r mrhaav-source/atc-fib-fm350_gl/*              mrhaavfeed/atc-fib-fm350_gl/
          cp -r mrhaav-source/luci/protocols/luci-proto-atc/* mrhaavfeed/luci-proto-atc/

          # argon: one sub-directory per package inside argonfeed/
          mkdir -p argonfeed/luci-theme-argon
          mkdir -p argonfeed/luci-app-argon-config
          cp -r argon-theme-source/*  argonfeed/luci-theme-argon/
          cp -r argon-config-source/* argonfeed/luci-app-argon-config/

          # quectel-timesync: place directly into SDK package/ tree
          cp -r quectel-source/openwrt/quectel-timesync     "${{ env.SDK_NAME }}/package/quectel-timesync"
          cp -r quectel-source/luci-app-quectel-timesync    "${{ env.SDK_NAME }}/package/luci-app-quectel-timesync"

      # ── Feeds ─────────────────────────────────────────────────────────────
      - name: Set up feeds and remove diskman
        run: |
          cd "${{ env.SDK_NAME }}"
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default

          # QModem: the repo root IS the feed (feeds scans recursively for Makefiles)
          printf '%s\n' "src-link qmodem     ${{ github.workspace }}/qmodem-source"                     >> feeds.conf.default
          printf '%s\n' "src-link mrhaavfeed ${{ github.workspace }}/mrhaavfeed"                         >> feeds.conf.default
          printf '%s\n' "src-link argonfeed  ${{ github.workspace }}/argonfeed"                          >> feeds.conf.default
          printf '%s\n' "src-git  luci       https://github.com/immortalwrt/luci.git;openwrt-24.10"     >> feeds.conf.default
          printf '%s\n' "src-git  packages   https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default

          ./scripts/feeds update -a

          # Remove diskman AFTER update but BEFORE install to break circular dep
          rm -rf feeds/luci/applications/luci-app-diskman

          ./scripts/feeds install -a

          echo "=== qmodem feed symlinks ==="
          ls package/feeds/qmodem/ | sort

      # ── .config ───────────────────────────────────────────────────────────
      # Use only echo statements — no heredoc — to avoid column-0 content
      # breaking the YAML literal block scalar and corrupting the on: trigger.
      - name: Configure build
        run: |
          cd "${{ env.SDK_NAME }}"

          echo 'CONFIG_ALL=n'       > .config
          echo 'CONFIG_ALL_KMODS=n' >> .config
          echo 'CONFIG_DEVEL=y'     >> .config

          # Enable libcap in SDK (required by coreutils and other packages)
          echo 'CONFIG_PACKAGE_libcap=y' >> .config
          echo 'CONFIG_LIBCAP_STATIC=n' >> .config

          # Kernel USB stubs (required by vendor kmod DEPENDS)
          echo 'CONFIG_PACKAGE_kmod-usb-core=m' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-net=m'  >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-wdm=m'  >> .config
          echo 'CONFIG_PACKAGE_kmod-mii=m'      >> .config

          # QModem vendor kernel modules
          # CONFIG symbol = kmod-<KernelPackage/NAME> from each driver Makefile
          echo 'CONFIG_PACKAGE_kmod-qmi_wwan_q=m' >> .config
          echo 'CONFIG_PACKAGE_kmod-qmi_wwan_f=m' >> .config
          echo 'CONFIG_PACKAGE_kmod-qmi_wwan_s=m' >> .config
          echo 'CONFIG_PACKAGE_kmod-pcie_mhi=m'   >> .config

          # QModem core userspace (PKG_NAME values from application/*/Makefile)
          echo 'CONFIG_PACKAGE_qmodem=m'           >> .config
          echo 'CONFIG_PACKAGE_qmodem_monitor=m'   >> .config
          echo 'CONFIG_PACKAGE_tom_modem=m'        >> .config
          echo 'CONFIG_PACKAGE_ubus-at-daemon=m'   >> .config
          echo 'CONFIG_PACKAGE_sms-tool_q=m'       >> .config
          echo 'CONFIG_PACKAGE_sms-forwarder-next=m' >> .config
          # PKG_NAME in application/quectel_CM_5G_M/Makefile is "quectel-CM-5G-M" (hyphens)
          echo 'CONFIG_PACKAGE_quectel-CM-5G-M=m'  >> .config

          # QModem feature-flag symbols (conditional DEPENDS gates in luci-app-qmodem)
          echo 'CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y'       >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y'        >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y'                >> .config

          # QModem LuCI frontends (from luci/luci-app-qmodem-*/Makefile)
          echo 'CONFIG_PACKAGE_luci-app-qmodem-next=m'    >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem-monitor=m' >> .config

          # quectel-timesync (lives directly in package/ - not a feed)
          echo 'CONFIG_PACKAGE_quectel-timesync=m'          >> .config
          echo 'CONFIG_PACKAGE_luci-app-quectel-timesync=m' >> .config

          # mrhaav packages (via mrhaavfeed)
          echo 'CONFIG_PACKAGE_atc-fib-fm350_gl=m' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-atc=m'   >> .config

          # Argon packages (via argonfeed)
          echo 'CONFIG_PACKAGE_luci-theme-argon=m'      >> .config
          echo 'CONFIG_PACKAGE_luci-app-argon-config=m' >> .config

          make defconfig

          echo "=== FINAL CONFIG CHECK ==="
          grep -E "^CONFIG_PACKAGE_(kmod-|qmodem|tom_modem|ubus-at|sms-|quectel|luci-app-qmodem|luci-theme-argon|luci-app-argon|atc-fib|luci-proto)" \
               .config | sort

      # ── Build steps ───────────────────────────────────────────────────────
      # IMPORTANT: compile paths use the SOURCE DIRECTORY NAME inside the feed,
      # NOT the KernelPackage name or PKG_NAME.
      #
      # QModem repo layout → feed symlink name:
      #   driver/quectel_QMI_WWAN → package/feeds/qmodem/quectel_QMI_WWAN
      #   driver/fibocom_QMI_WWAN → package/feeds/qmodem/fibocom_QMI_WWAN
      #   driver/simcom_QMI_WWAN  → package/feeds/qmodem/simcom_QMI_WWAN
      #   driver/quectel_MHI      → package/feeds/qmodem/quectel_MHI
      #   application/qmodem      → package/feeds/qmodem/qmodem
      #   application/ubus_at_daemon → package/feeds/qmodem/ubus_at_daemon
      #   application/sms_forwarder_next → package/feeds/qmodem/sms_forwarder_next
      #   application/quectel_CM_5G_M → package/feeds/qmodem/quectel_CM_5G_M
      #   luci/luci-app-qmodem-next → package/feeds/qmodem/luci-app-qmodem-next

      - name: Build vendor kmods
        run: |
          cd "${{ env.SDK_NAME }}"
          make package/feeds/qmodem/quectel_QMI_WWAN/compile V=s
          make package/feeds/qmodem/fibocom_QMI_WWAN/compile V=s
          make package/feeds/qmodem/simcom_QMI_WWAN/compile  V=s
          make package/feeds/qmodem/quectel_MHI/compile      V=s

      - name: Build QModem userspace packages individually
        run: |
          cd "${{ env.SDK_NAME }}"
          # Build each qmodem package individually to avoid feed-level compile target issues
          # This mirrors the working separate workflow approach
          make package/feeds/qmodem/qmodem/compile V=s
          make package/feeds/qmodem/qmodem_monitor/compile V=s
          make package/feeds/qmodem/tom_modem/compile V=s
          make package/feeds/qmodem/ubus_at_daemon/compile V=s
          make package/feeds/qmodem/sms-tool_q/compile V=s
          make package/feeds/qmodem/sms_forwarder_next/compile V=s
          make package/feeds/qmodem/quectel_CM_5G_M/compile V=s
          make package/feeds/qmodem/luci-app-qmodem-next/compile V=s
          make package/feeds/qmodem/luci-app-qmodem-monitor/compile V=s

      - name: Build quectel-timesync
        run: |
          cd "${{ env.SDK_NAME }}"
          # These live directly in package/ so no feeds/ prefix
          make package/quectel-timesync/compile          V=s
          make package/luci-app-quectel-timesync/compile V=s

      - name: Build mrhaav packages
        run: |
          cd "${{ env.SDK_NAME }}"
          make package/feeds/mrhaavfeed/atc-fib-fm350_gl/compile V=s
          make package/feeds/mrhaavfeed/luci-proto-atc/compile   V=s

      - name: Build Argon theme and config
        run: |
          cd "${{ env.SDK_NAME }}"
          make package/feeds/argonfeed/luci-theme-argon/compile      V=s
          make package/feeds/argonfeed/luci-app-argon-config/compile V=s

      # ── Collect all IPKs ──────────────────────────────────────────────────
      - name: Collect all IPKs
        run: |
          mkdir -p ipks
          ARCH="${{ env.ARCH }}"
          SDK_DIR="${{ env.SDK_NAME }}"

          echo "=== Full bin/ tree ==="
          find "$SDK_DIR/bin" -name "*.ipk" | sort

          # Vendor kmods (KernelPackages land anywhere under bin/)
          find "$SDK_DIR/bin" \( \
            -name "kmod-qmi_wwan_q_*.ipk" -o \
            -name "kmod-qmi_wwan_f_*.ipk" -o \
            -name "kmod-qmi_wwan_s_*.ipk" -o \
            -name "kmod-pcie_mhi_*.ipk"   \
          \) -exec cp {} ipks/ \;

          # All qmodem feed packages (userspace + luci)
          find "$SDK_DIR/bin/packages/$ARCH/qmodem/" -name "*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true

          # mrhaav feed packages
          find "$SDK_DIR/bin/packages/$ARCH/mrhaavfeed/" -name "*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true

          # argon feed packages
          find "$SDK_DIR/bin/packages/$ARCH/argonfeed/" -name "*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true

          # quectel-timesync (lands in base/ as a direct package/)
          find "$SDK_DIR/bin" -name "quectel-timesync_*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true
          find "$SDK_DIR/bin" -name "luci-app-quectel-timesync_*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true

          echo "=== Collected IPKs ==="
          ls -lh ipks/
          [ "$(ls -A ipks/)" ] || { echo "FATAL: Zero IPKs collected"; exit 1; }

      - name: Upload all IPKs
        uses: actions/upload-artifact@v4
        with:
          name: all-ipks
          path: ipks/*.ipk

  # ======================= RELEASE ===========================================
  release:
    needs: [check-and-build, build-all]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all IPKs
        uses: actions/download-artifact@v4
        with:
          name: all-ipks
          path: release-ipks

      - name: Verify IPKs for release
        run: |
          echo "=== Files ready to publish ==="
          ls -lh release-ipks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-ipks/*
          tag_name: qmodem-extras-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
          name: "QModem + Extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
