name: TEST ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SDK_NAME: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
  SDK_TAR:  immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  SDK_URL:  https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  ARCH:     arm_cortex-a9_vfpv3-d16

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Restore last built SHA cache
        uses: actions/cache@v4
        with:
          path: .last_built_sha
          key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
          restore-keys: |
            qmodem-last-built-sha-24.10.4-

      - name: Check latest upstream commit
        id: check
        run: |
          UPSTREAM_REPO="FUjr/QModem"
          API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
          LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
          LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
          FORCE="${{ github.event.inputs.force_rebuild }}"
          echo "Latest upstream SHA : $LATEST_SHA"
          echo "Last built SHA      : $LAST_BUILT_SHA"
          echo "Force rebuild       : $FORCE"
          if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
            echo "New commits detected — build triggered."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .last_built_sha
          elif [ "$FORCE" = "true" ]; then
            echo "No new commits, but force_rebuild=true — build triggered anyway."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .last_built_sha
          else
            echo "No new commits and force_rebuild=false — skipping build."
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          fi

  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QModem source
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-source
          ref: main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v5

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"

      - name: Set up feeds
        run: |
          cd "${{ env.SDK_NAME }}"
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default
          printf '%s\n' "src-link qmodem   ${{ github.workspace }}/qmodem-source" >> feeds.conf.default
          printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
          printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/luci-app-diskman
          ./scripts/feeds install -a

      - name: Configure and build
        run: |
          cd "${{ env.SDK_NAME }}"

          {
            echo 'CONFIG_PACKAGE_kmod-usb-core=m'
            echo 'CONFIG_PACKAGE_kmod-usb-net=m'
            echo 'CONFIG_PACKAGE_kmod-usb-wdm=m'
            echo 'CONFIG_PACKAGE_kmod-mii=m'
            echo 'CONFIG_PACKAGE_kmod-qmi_wwan_q=m'
            echo 'CONFIG_PACKAGE_kmod-qmi_wwan_f=m'
            echo 'CONFIG_PACKAGE_kmod-qmi_wwan_s=m'
            echo 'CONFIG_PACKAGE_kmod-pcie_mhi=m'
            echo 'CONFIG_PACKAGE_qmodem=m'
            echo 'CONFIG_PACKAGE_qmodem_monitor=m'
            echo 'CONFIG_PACKAGE_tom_modem=m'
            echo 'CONFIG_PACKAGE_ubus-at-daemon=m'
            echo 'CONFIG_PACKAGE_sms-tool_q=m'
            echo 'CONFIG_PACKAGE_sms-forwarder-next=m'
            echo 'CONFIG_PACKAGE_quectel-CM-5G-M=m'
            echo 'CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y'
            echo 'CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y'
            echo 'CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y'
            echo 'CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y'
            echo 'CONFIG_PACKAGE_luci-app-qmodem-next=m'
            echo 'CONFIG_PACKAGE_luci-app-qmodem-monitor=m'
          } >> .config

          make defconfig
          # Use package/compile to resolve all dependencies together (libcap, coreutils, lucihttp, etc.)
          make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | grep -E "^(make\[1\].*Entering|make\[1\].*Leaving|time:|  ERROR|ERROR:)" || true

      - name: Collect QModem IPKs
        run: |
          mkdir -p ipks-qmodem
          find "${{ env.SDK_NAME }}/bin" \( -name "kmod-qmi_wwan_q_*.ipk" -o -name "kmod-qmi_wwan_f_*.ipk" -o -name "kmod-qmi_wwan_s_*.ipk" -o -name "kmod-pcie_mhi_*.ipk" \) -exec cp {} ipks-qmodem/ \;
          find "${{ env.SDK_NAME }}/bin/packages/${{ env.ARCH }}/qmodem/" -name "*.ipk" -exec cp {} ipks-qmodem/ \; 2>/dev/null || true
          ls -lh ipks-qmodem/

      - name: Upload QModem IPKs
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-ipks
          path: ipks-qmodem/*.ipk

  build-timesync:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quectel-timesync
        uses: actions/checkout@v4
        with:
          repository: sevvian/quectel-timesync
          path: quectel-source
          ref: master
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v5
      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"
      - name: Copy packages and set up feeds
        run: |
          cd "${{ env.SDK_NAME }}"
          cp -r "${{ github.workspace }}/quectel-source/openwrt/quectel-timesync" package/quectel-timesync
          cp -r "${{ github.workspace }}/quectel-source/luci-app-quectel-timesync" package/luci-app-quectel-timesync
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default
          printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
          printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build timesync
        run: |
          cd "${{ env.SDK_NAME }}"
          echo 'CONFIG_PACKAGE_quectel-timesync=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-quectel-timesync=m' >> .config
          make defconfig
          # Build using package/compile to resolve dependencies properly
          make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | grep -E "^(make\[1\].*Entering|make\[1\].*Leaving|time:|  ERROR|ERROR:)" || true
      - name: Collect timesync IPKs
        run: |
          mkdir -p ipks-timesync
          find "${{ env.SDK_NAME }}/bin" -name "quectel-timesync_*.ipk" -exec cp {} ipks-timesync/ \;
          find "${{ env.SDK_NAME }}/bin" -name "luci-app-quectel-timesync_*.ipk" -exec cp {} ipks-timesync/ \;
          ls -lh ipks-timesync/
      - name: Upload timesync IPKs
        uses: actions/upload-artifact@v4
        with:
          name: timesync-ipks
          path: ipks-timesync/*.ipk

  build-mrhaav:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mrhaav packages
        uses: actions/checkout@v4
        with:
          repository: mrhaav/openwrt-packages
          path: mrhaav-source
          ref: main
          sparse-checkout: |
            atc-fib-fm350_gl
            luci/protocols/luci-proto-atc
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v5
      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"
      - name: Create feed and set up
        run: |
          mkdir -p mrhaavfeed/atc-fib-fm350_gl
          mkdir -p mrhaavfeed/luci-proto-atc
          cp -r "${{ github.workspace }}/mrhaav-source/atc-fib-fm350_gl/"* mrhaavfeed/atc-fib-fm350_gl/
          cp -r "${{ github.workspace }}/mrhaav-source/luci/protocols/luci-proto-atc/"* mrhaavfeed/luci-proto-atc/
          cd "${{ env.SDK_NAME }}"
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default
          printf '%s\n' "src-link mrhaavfeed ${{ github.workspace }}/mrhaavfeed" >> feeds.conf.default
          printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
          printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build mrhaav packages
        run: |
          cd "${{ env.SDK_NAME }}"
          echo 'CONFIG_PACKAGE_atc-fib-fm350_gl=m' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-atc=m' >> .config
          make defconfig
          # Build using package/compile to resolve dependencies properly
          make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | grep -E "^(make\[1\].*Entering|make\[1\].*Leaving|time:|  ERROR|ERROR:)" || true
      - name: Collect mrhaav IPKs
        run: |
          mkdir -p ipks-mrhaav
          find "${{ env.SDK_NAME }}/bin/packages/${{ env.ARCH }}/mrhaavfeed/" -name "*.ipk" -exec cp {} ipks-mrhaav/ \; 2>/dev/null || true
          find "${{ env.SDK_NAME }}/bin" -name "atc-fib-fm350_gl_*.ipk" -o -name "luci-proto-atc_*.ipk" | xargs -I{} cp {} ipks-mrhaav/
          ls -lh ipks-mrhaav/
      - name: Upload mrhaav IPKs
        uses: actions/upload-artifact@v4
        with:
          name: mrhaav-ipks
          path: ipks-mrhaav/*.ipk

  build-argon:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Argon theme
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-theme-argon
          path: argon-theme-source
          ref: master
      - name: Checkout Argon config
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-app-argon-config
          path: argon-config-source
          ref: master
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v5
      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"
      - name: Create feed and set up
        run: |
          mkdir -p argonfeed/luci-theme-argon
          mkdir -p argonfeed/luci-app-argon-config
          cp -r "${{ github.workspace }}/argon-theme-source/"* argonfeed/luci-theme-argon/
          cp -r "${{ github.workspace }}/argon-config-source/"* argonfeed/luci-app-argon-config/
          cd "${{ env.SDK_NAME }}"
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default
          printf '%s\n' "src-link argonfeed  ${{ github.workspace }}/argonfeed" >> feeds.conf.default
          printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
          printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build Argon packages
        run: |
          cd "${{ env.SDK_NAME }}"
          echo 'CONFIG_PACKAGE_luci-theme-argon=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-argon-config=m' >> .config
          make defconfig
          # Build using package/compile to resolve dependencies properly (avoids wget/lua issues)
          make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | grep -E "^(make\[1\].*Entering|make\[1\].*Leaving|time:|  ERROR|ERROR:)" || true
      - name: Collect Argon IPKs
        run: |
          mkdir -p ipks-argon
          find "${{ env.SDK_NAME }}/bin/packages/${{ env.ARCH }}/argonfeed/" -name "*.ipk" -exec cp {} ipks-argon/ \; 2>/dev/null || true
          find "${{ env.SDK_NAME }}/bin" -name "luci-theme-argon_*.ipk" -o -name "luci-app-argon-config_*.ipk" | xargs -I{} cp {} ipks-argon/
          ls -lh ipks-argon/
      - name: Upload Argon IPKs
        uses: actions/upload-artifact@v4
        with:
          name: argon-ipks
          path: ipks-argon/*.ipk

  release:
    needs: [check-and-build, build-qmodem, build-timesync, build-mrhaav, build-argon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all IPKs
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
      - name: Flatten IPKs into single directory
        run: |
          mkdir -p release-ipks
          find all-ipks -name "*.ipk" -exec cp {} release-ipks/ \;
          echo "=== IPKs for release ==="
          ls -lh release-ipks/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-ipks/*
          tag_name: qmodem-extras-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
          name: "QModem + Extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
