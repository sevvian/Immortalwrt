name: Build QModem for ImmortalWrt 24.10.6 (mvebu/cortexa9)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}

    steps:
    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s $API_URL | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        echo "Latest upstream SHA: $LATEST_SHA"
        echo "Last built SHA: $LAST_BUILT_SHA"
        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected. Triggering build."
          echo "build_needed=true" >> $GITHUB_OUTPUT
          echo "upstream_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits. Skipping build."
          echo "build_needed=false" >> $GITHUB_OUTPUT
        fi

    - name: Cache last built SHA
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

    - name: Download ImmortalWrt SDK 24.10.6 (mvebu/cortexa9)
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
        cd immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64

    - name: Add feeds and update (fix detached HEAD)
      run: |
        cd immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        # Remove broken base feed – forces re-clone to avoid 'git pull' failure
        rm -rf feeds/base
        # Add QModem feed with its own CM variant
        echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        # Install only the packages we need (reduces chance of conflicts)
        ./scripts/feeds install luci-app-qmodem
        ./scripts/feeds install luci-app-qmodem-sms

    - name: Configure build options (non‑interactive)
      run: |
        cd immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        # Select Tom customized Quectel CM (avoids dependency on missing quectel-CM-5G)
        echo "CONFIG_PACKAGE_quectel_CM_5G_M=y" >> .config
        echo "# CONFIG_PACKAGE_quectel-CM-5G is not set" >> .config
        # Disable MHI (PCIe) drivers – not needed for USB modems
        echo "# CONFIG_PACKAGE_quectel_MHI is not set" >> .config
        echo "# CONFIG_PACKAGE_fibocom_QMI_WWAN is not set" >> .config
        echo "# CONFIG_PACKAGE_simcom_QMI_WWAN is not set" >> .config
        # Generate a full .config without requiring a terminal
        make defconfig

    - name: Build QModem packages
      run: |
        cd immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        make package/luci-app-qmodem/compile V=s
        make package/luci-app-qmodem-sms/compile V=s

    - name: Collect IPK files
      run: |
        mkdir -p ipks
        find immortalwrt-sdk-24.10.6-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64/bin -name "*.ipk" -exec cp {} ipks \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ipks/*
        tag_name: qmodem-${{ needs.check-and-build.outputs.upstream_sha }}
        name: "QModem for mvebu/cortexa9 – ${{ needs.check-and-build.outputs.upstream_sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
