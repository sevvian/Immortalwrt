name: Build QModem for ImmortalWrt 24.10.6 (Raspberry Pi 4B)

on:
#  schedule:
#    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}

    steps:
    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s $API_URL | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        echo "Latest upstream SHA: $LATEST_SHA"
        echo "Last built SHA: $LAST_BUILT_SHA"
        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected. Triggering build."
          echo "build_needed=true" >> $GITHUB_OUTPUT
          echo "upstream_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits. Skipping build."
          echo "build_needed=false" >> $GITHUB_OUTPUT
        fi

    - name: Cache last built SHA
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-rpi4-last-built-sha-${{ github.run_id }}
        restore-keys: |
          qmodem-rpi4-last-built-sha-

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

    # ------------------------------------------------------------------
    # SDK Cache – speeds up subsequent runs dramatically
    # ------------------------------------------------------------------
    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-rpi4-24.10.6-v1   # bump v1 → v2 if SDK version changes

    - name: Download & extract SDK (only if cache miss)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/bcm27xx/bcm2711/immortalwrt-sdk-24.10.6-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.6-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    - name: Add feeds and update (fix detached HEAD)
      run: |
        cd immortalwrt-sdk-24.10.6-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64
        rm -rf feeds/base
        sed -i '/^src-git qmodem /d' feeds.conf.default
        echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install luci-app-qmodem
        ./scripts/feeds install luci-app-qmodem-sms
        ./scripts/feeds install qmodem_monitor
        ./scripts/feeds install luci-app-qmodem-monitor

    - name: Configure build options (non‑interactive)
      run: |
        cd immortalwrt-sdk-24.10.6-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64
        echo "CONFIG_PACKAGE_quectel_CM_5G_M=y" >> .config
        echo "# CONFIG_PACKAGE_quectel-CM-5G is not set" >> .config
        echo "# CONFIG_PACKAGE_quectel_MHI is not set" >> .config
        echo "# CONFIG_PACKAGE_fibocom_QMI_WWAN is not set" >> .config
        echo "# CONFIG_PACKAGE_simcom_QMI_WWAN is not set" >> .config
        make defconfig

    - name: Build QModem packages
      run: |
        cd immortalwrt-sdk-24.10.6-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64
        make package/luci-app-qmodem/compile V=s
        make package/luci-app-qmodem-sms/compile V=s
        make package/qmodem_monitor/compile V=s
        make package/luci-app-qmodem-monitor/compile V=s

    - name: Collect IPK files (QModem only)
      run: |
        mkdir -p ipks
        SDK_DIR=$(ls -d immortalwrt-sdk-* | head -1)
        ARCH="aarch64_cortex-a72"
        PKG_DIR="$SDK_DIR/bin/packages/$ARCH/qmodem"
        if [ -d "$PKG_DIR" ]; then
          cp "$PKG_DIR"/*.ipk ipks/
          echo "Copied QModem packages from $PKG_DIR"
        else
          echo "QModem package directory not found. Listing available archs:"
          ls -d "$SDK_DIR/bin/packages/"*/
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ipks/*
        tag_name: qmodem-rpi4-${{ needs.check-and-build.outputs.upstream_sha }}
        name: "QModem for Raspberry Pi 4B – ${{ needs.check-and-build.outputs.upstream_sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
