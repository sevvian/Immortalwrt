name: Build QModem for OpenWrt 24.10.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QModem Repository
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-src

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd

      - name: Download and Setup OpenWrt SDK
        run: |
          # Verified URL for 24.10.4 mvebu/cortexa9
          SDK_URL="https://downloads.openwrt.org/releases/24.10.4/targets/mvebu/cortexa9/openwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
          wget $SDK_URL
          # Using tar with zstd decompression
          tar -I zstd -xf *.tar.zst
          mv openwrt-sdk-* sdk

      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate QModem Packages
        run: |
          mkdir -p sdk/package/qmodem
          # Copy only the subdirectories from driver/ which contain Makefiles
          find qmodem-src/driver/ -maxdepth 1 -mindepth 1 -type d -exec cp -r {} sdk/package/qmodem/ \;
          
          cd sdk
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Configure and Compile
        working-directory: sdk
        run: |
          # Generate base configuration
          make defconfig
          
          # Force the build system to see our new packages
          # We build them specifically to ensure we get the .ipk files
          for pkg in $(ls package/qmodem); do
            echo "Building package: $pkg"
            # Enable the package in .config
            # Kernel modules are 'm', Apps are 'y' or 'm'
            if [[ $pkg == *"quectel_QMI"* ]] || [[ $pkg == *"quectel_MHI"* ]]; then
              echo "CONFIG_PACKAGE_kmod-$pkg=m" >> .config
            else
              echo "CONFIG_PACKAGE_$pkg=m" >> .config
            fi
            
            # Build the package
            make package/qmodem/$pkg/compile V=s
          done

      - name: Collect Artifacts
        run: |
          mkdir -p output
          # Collect Compiled Kernel Modules and Apps
          find sdk/bin/ -name "*.ipk" -exec cp {} output/ \;

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QModem-OpenWrt-24.10.4-mvebu-v2
          path: output/
