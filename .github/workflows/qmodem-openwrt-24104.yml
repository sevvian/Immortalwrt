name: Build QModem for OpenWrt 24.10.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QModem Repository
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-src

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 \
            zstd file xz-utils

      - name: Download and Setup OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/24.10.4/targets/mvebu/cortexa9/openwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
          wget -q $SDK_URL -O sdk.tar.zst
          # Verified Method: Create directory first, then extract into it stripping the root folder
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate QModem Packages
        run: |
          # Create a custom category in the SDK
          mkdir -p sdk/package/qmodem
          # Copy each sub-driver folder into the SDK package tree
          cp -r qmodem-src/driver/* sdk/package/qmodem/
          
          # Refresh the package index to include the new QModem folders
          cd sdk
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Configure and Build Packages
        working-directory: sdk
        env:
          # Ensure toolchain is in path for kernel modules
          STAGING_DIR: ${{ github.workspace }}/sdk/staging_dir
        run: |
          # Generate the default configuration
          make defconfig
          
          # Find all packages we just added and enable them in .config
          # We search for 'Package/' or 'KernelPackage/' definitions in the Makefiles
          for makefile in $(find package/qmodem -name Makefile); do
            # Extract package names (e.g., quectel-cm or kmod-quectel-qmi-wwan)
            PKG_NAME=$(grep -oP '(?<=Package/)\w+([-]\w+)*' $makefile | head -n 1)
            KMOD_NAME=$(grep -oP '(?<=KernelPackage/)\w+([-]\w+)*' $makefile | head -n 1)
            
            if [ ! -z "$PKG_NAME" ]; then
              echo "Enabling App: CONFIG_PACKAGE_$PKG_NAME=m" >> .config
              echo "building $PKG_NAME..."
            fi
            if [ ! -z "$KMOD_NAME" ]; then
              echo "Enabling Kmod: CONFIG_PACKAGE_kmod-$KMOD_NAME=m" >> .config
              echo "building kmod-$KMOD_NAME..."
            fi
          done

          # Run the build for all packages in the qmodem subdirectory
          make package/qmodem/compile V=s -j$(nproc)

      - name: Collect Artifacts
        run: |
          mkdir -p output
          # Find all .ipk files generated in the bin directory
          find sdk/bin/ -name "*.ipk" -exec cp {} output/ \;

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QModem-OpenWrt-24.10.4-mvebu-v3
          path: output/
