name: Build QModem for OpenWrt 24.10.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QModem Repository
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-src

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 \
            zstd file xz-utils

      - name: Download and Setup OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/24.10.4/targets/mvebu/cortexa9/openwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
          wget -q $SDK_URL -O sdk.tar.zst
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          
          # CRITICAL FIX: Create missing directories required by the OpenWrt Prerequisite system
          mkdir -p sdk/host sdk/tmp sdk/staging_dir/host
          touch sdk/host/.prereq-build

      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate QModem Packages
        run: |
          mkdir -p sdk/package/qmodem
          # Copy driver subdirectories to the SDK
          cp -r qmodem-src/driver/* sdk/package/qmodem/
          
          cd sdk
          # Re-index to find the new packages
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Compile QModem Packages
        working-directory: sdk
        run: |
          # The SDK architecture is already fixed. We just need to enable the specific packages.
          # We use 'make defconfig' only after the packages are in place.
          
          # Step 1: Find and enable the packages in .config
          for makefile in $(find package/qmodem -name Makefile); do
            # Find Package name (Apps)
            PKG=$(grep -oP '(?<=Package/)\w+([-]\w+)*' $makefile | head -n 1)
            # Find KernelPackage name (Drivers)
            KMOD=$(grep -oP '(?<=KernelPackage/)\w+([-]\w+)*' $makefile | head -n 1)
            
            if [ ! -z "$PKG" ]; then
              echo "CONFIG_PACKAGE_$PKG=m" >> .config
            fi
            if [ ! -z "$KMOD" ]; then
              echo "CONFIG_PACKAGE_kmod-$KMOD=m" >> .config
            fi
          done

          # Step 2: Expand dependencies and finalize configuration
          make defconfig
          
          # Step 3: Build
          # We build the entire qmodem directory to catch all drivers/apps
          make package/qmodem/compile V=s -j$(nproc)

      - name: Collect Artifacts
        run: |
          mkdir -p output
          # Copy .ipk files from the bin/packages/ architecture folder
          find sdk/bin/packages/ -name "*.ipk" -exec cp {} output/ \;
          # Copy .ipk files from the bin/targets/ kernel folder (for kmods)
          find sdk/bin/targets/ -name "*.ipk" -exec cp {} output/ \;

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QModem-OpenWrt-24.10.4-mvebu-v4
          path: output/
