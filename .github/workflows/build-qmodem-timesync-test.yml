name: Build QModem for ImmortalWrt 24.10.4 (Linksys WRT3200acm mvebu/cortexa9) TEST KMOD

on:
  workflow_dispatch:

jobs:
  # ---------- Job 1: Check QModem upstream changes ----------
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
    # Cache restore MUST be before the check step that reads the file.
    - name: Restore last built SHA cache
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-24.10.4-

    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        echo "Latest upstream SHA: $LATEST_SHA"
        echo "Last built SHA:      $LAST_BUILT_SHA"
        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected. Triggering build."
          echo "build_needed=true"         >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA"  >> "$GITHUB_OUTPUT"
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits. Skipping build."
          echo "build_needed=false" >> "$GITHUB_OUTPUT"
        fi

  # ---------- Job 2: Build QModem (kmods + all userspace) ----------
  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout QModem source
      uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        path: qmodem-source
        ref: main

    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses-dev libssl-dev python3-dev python3-setuptools \
          rsync unzip zlib1g-dev file wget zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        key: sdk-mvebu-cortexa9-24.10.4-v1

    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_TARBALL="immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/$SDK_TARBALL"
        wget -q "$SDK_URL"
        tar --zstd -xf "$SDK_TARBALL"
        rm -f "$SDK_TARBALL"

    - name: Set SDK_DIR environment variable
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64)
        echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

    - name: Set up feeds (QModem + essential ImmortalWrt feeds)
      run: |
        cd "$SDK_DIR"
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default

        # qmodem feed must be first so its packages are discoverable before
        # luci/packages feeds install their own conflicting packages.
        printf '%s\n' "src-link qmodem   ${{ github.workspace }}/qmodem-source"                     >> feeds.conf.default
        printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10"     >> feeds.conf.default
        printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default

        ./scripts/feeds update -a

        # WORKAROUND: Remove conflicting package that creates circular deps
        rm -rf feeds/luci/applications/luci-app-diskman

        ./scripts/feeds install -a

        echo "=== qmodem feed symlinks ==="
        ls package/feeds/qmodem/ | sort

    - name: Write .config and resolve dependencies
      run: |
        cd "$SDK_DIR"

        # ── Kernel USB stubs (satisfy defconfig dependency checks) ────────────
        echo "CONFIG_PACKAGE_kmod-usb-core=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-mii=m"       >> .config

        # ── Vendor kernel modules ─────────────────────────────────────────────
        # CONFIG key = "kmod-" + the KernelPackage/NAME exactly as written in
        # the Makefile, preserving underscores (NOT converted to dashes).
        #   driver/quectel_QMI_WWAN  →  KernelPackage/qmi_wwan_q  →  kmod-qmi_wwan_q
        #   driver/fibocom_QMI_WWAN  →  KernelPackage/qmi_wwan_f  →  kmod-qmi_wwan_f
        #   driver/simcom_QMI_WWAN   →  KernelPackage/qmi_wwan_s  →  kmod-qmi_wwan_s
        #   driver/quectel_MHI       →  KernelPackage/pcie_mhi    →  kmod-pcie_mhi
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
        echo "CONFIG_PACKAGE_kmod-pcie_mhi=m"   >> .config

        # ── QModem core userspace packages ────────────────────────────────────
        # Select every package that makes up the qmodem feed so that
        # make package/compile can resolve all cross-feed deps (libjson-c,
        # libubox, lucihttp, luci-base, etc.) in the correct order.
        echo "CONFIG_PACKAGE_qmodem=m"            >> .config
        echo "CONFIG_PACKAGE_qmodem_monitor=m"    >> .config
        echo "CONFIG_PACKAGE_tom_modem=m"         >> .config
        echo "CONFIG_PACKAGE_ubus-at-daemon=m"    >> .config
        echo "CONFIG_PACKAGE_sms-tool_q=m"        >> .config
        echo "CONFIG_PACKAGE_sms-forwarder-next=m" >> .config
        echo "CONFIG_PACKAGE_quectel-CM-5G-M=m"  >> .config

        # ── Feature-flag config symbols (live in luci-app-qmodem namespace) ──
        # The qmodem base-package DEPENDS uses conditional deps gated on these
        # symbols. Setting them pulls in the correct optional deps automatically.
        #   +PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan:kmod-qmi_wwan_q/f/s
        #   +PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER:kmod-pcie_mhi
        #   +PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM:quectel-CM-5G-M
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y"      >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y"       >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y"               >> .config

        # ── LuCI JS-only frontend ─────────────────────────────────────────────
        # luci-app-qmodem-next  DEPENDS: qmodem, luci-base, sms-forwarder-next
        # luci-app-qmodem-monitor DEPENDS: qmodem, qmodem_monitor, luci-base,
        #                                  luci-app-qmodem-next
        # luci-base DEPENDS: lucihttp  (C lib, compiled from luci feed)
        # All of these are resolved automatically by make package/compile.
        echo "CONFIG_PACKAGE_luci-app-qmodem-next=m"    >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config

        # Resolve config — auto-selects transitive deps from all feeds
        make defconfig

        echo "=== FINAL BUILD CONFIG CHECK ==="
        grep -E "^CONFIG_PACKAGE_(kmod-qmi_wwan|kmod-pcie_mhi|qmodem|tom_modem|ubus-at|sms-|quectel|luci-app-qmodem)" \
             .config | sort
        echo "================================="

    - name: Build all QModem packages (kmods + userspace)
      run: |
        cd "$SDK_DIR"
        # ── WHY make package/compile, not individual make package/X/compile ──
        #
        # Calling packages individually (the previous approach) fails for any
        # package that has cross-feed dependencies (libjson-c, lucihttp, etc.)
        # because those dependency packages aren't staged yet when the target
        # package compile starts.
        #
        # make package/compile reads the full .config, computes a dependency
        # graph across ALL feeds, and builds every selected package in the
        # correct topological order:
        #   libjson-c → quectel-CM-5G-M, tom_modem, ubus-at-daemon
        #   lucihttp  → luci-base → luci-app-qmodem-next/monitor
        #
        # -j$(nproc) parallelises independent packages within the same dep level.
        # IGNORE_ERRORS=m continues past any single-package failure so we
        # can still collect and upload whatever did succeed.
        make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | \
          grep -E "^(make\[|time:|ERROR:|  ERROR)" || true

        echo ""
        echo "=== BUILD COMPLETE — verifying key artefacts ==="
        find bin/ -name "kmod-qmi_wwan_*.ipk" -o -name "kmod-pcie_mhi_*.ipk" | sort
        find bin/ -name "qmodem_*.ipk" -o -name "tom_modem_*.ipk" | sort
        find bin/ -name "luci-app-qmodem-*.ipk" | sort
        find bin/ -name "quectel-CM-5G-M_*.ipk" | sort

    - name: Collect QModem IPKs
      run: |
        mkdir -p ipks
        ARCH="arm_cortex-a9_vfpv3-d16"

        # ── 1. Vendor kmod IPKs ───────────────────────────────────────────────
        # Kernel module IPKs use underscore-based names matching KernelPackage/NAME.
        # They land under bin/targets/ in SDK builds; find handles both locations.
        find "$SDK_DIR/bin" \( \
          -name "kmod-qmi_wwan_q_*.ipk" -o \
          -name "kmod-qmi_wwan_f_*.ipk" -o \
          -name "kmod-qmi_wwan_s_*.ipk" -o \
          -name "kmod-pcie_mhi_*.ipk"   \
        \) -exec cp {} ipks/ \;

        # ── 2. All qmodem-feed userspace IPKs ────────────────────────────────
        # This picks up: qmodem, qmodem_monitor, tom_modem, ubus-at-daemon,
        # sms-tool_q, sms-forwarder-next, quectel-CM-5G-M,
        # luci-app-qmodem-next, luci-app-qmodem-monitor
        find "$SDK_DIR/bin/packages/$ARCH/qmodem/" -name "*.ipk" \
          -exec cp {} ipks/ \; 2>/dev/null || true

        # ── 3. Diagnostic ─────────────────────────────────────────────────────
        echo "=== COLLECTED IPKs ==="
        ls -lh ipks/
        echo ""
        echo "Kmod IPKs:"
        ls ipks/kmod-*.ipk 2>/dev/null || echo "  WARNING: No kmod IPKs!"
        echo ""
        echo "Userspace IPKs:"
        ls ipks/*.ipk 2>/dev/null | grep -v kmod || echo "  WARNING: No userspace IPKs!"

        # Fail the job explicitly if we collected nothing at all
        [ "$(ls ipks/*.ipk 2>/dev/null | wc -l)" -gt 0 ] || \
          { echo "FATAL: Zero IPKs collected — check build log above"; exit 1; }

    - name: Upload QModem IPKs
      uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk

  # ---------- Job 3: Release ----------
  release:
    needs: [check-and-build, build-qmodem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download QModem IPKs
      uses: actions/download-artifact@v4
      with:
        name: qmodem-ipks
        path: release-ipks

    - name: Verify IPKs for release
      run: |
        echo "=== Files ready to publish ==="
        ls -lh release-ipks/
        echo ""
        echo "Kmod IPKs:"
        ls release-ipks/kmod-*.ipk 2>/dev/null || echo "WARNING: no kmod IPKs"
        echo "Userspace IPKs:"
        ls release-ipks/*.ipk 2>/dev/null | grep -v kmod || echo "WARNING: no userspace IPKs"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-ipks/*
        tag_name: qmodem-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
        name: "QModem for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
