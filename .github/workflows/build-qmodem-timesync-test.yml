name: Build QModem + extras for ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:

jobs:
  # 1. Check for upstream changes (QModem)
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s $API_URL | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        echo "Latest upstream SHA: $LATEST_SHA"
        echo "Last built SHA: $LAST_BUILT_SHA"
        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected. Triggering build."
          echo "build_needed=true" >> $GITHUB_OUTPUT
          echo "upstream_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits. Skipping build."
          echo "build_needed=false" >> $GITHUB_OUTPUT
        fi

    - name: Cache last built SHA
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-24.10.4-

  # 2. Build QModem (Next, monitor, kmods, user‑space deps)
  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout QModem source
      uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        path: qmodem-source
        ref: main

    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-mvebu-cortexa9-24.10.4-v1

    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst

    - name: Set up feeds (QModem + ImmortalWrt standard feeds)
      run: |
        cd immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default
        printf '%s\n' "src-link qmodem ${{ github.workspace }}/qmodem-source" >> feeds.conf.default
        printf '%s\n' "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
        printf '%s\n' "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
        printf '%s\n' "src-git routing https://github.com/immortalwrt/routing.git;openwrt-24.10" >> feeds.conf.default
        printf '%s\n' "src-git telephony https://github.com/immortalwrt/telephony.git;openwrt-24.10" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure and build QModem packages
      run: |
        cd immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        echo "CONFIG_PACKAGE_luci-app-qmodem-next=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config
        echo "CONFIG_PACKAGE_quectel_CM_5G_M=m" >> .config
        echo "# CONFIG_PACKAGE_quectel-CM-5G is not set" >> .config
        echo "# CONFIG_PACKAGE_quectel-cm is not set" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi-wwan-q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi-wwan-f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi-wwan-s=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y" >> .config
        echo "# CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_generic-qmi-wwan is not set" >> .config
        echo "# CONFIG_PACKAGE_quectel_MHI is not set" >> .config
        echo "# CONFIG_PACKAGE_fibocom_MHI is not set" >> .config
        echo "# CONFIG_PACKAGE_simcom_MHI is not set" >> .config
        make defconfig
        make package/luci-app-qmodem-next/compile V=s
        make package/luci-app-qmodem-monitor/compile V=s

    - name: Collect QModem + dependency IPKs
      run: |
        mkdir -p ipks
        SDK_DIR=$(ls -d immortalwrt-sdk-* | head -1)
        ARCH="arm_cortex-a9_vfpv3-d16"
        # QModem feed packages
        cp "$SDK_DIR/bin/packages/$ARCH/qmodem/"*.ipk ipks/ 2>/dev/null
        # Required user‑space dependencies (now built from the packages feed)
        for pkg in curl terminfo bc coreutils coreutils-stat usbutils; do
          cp "$SDK_DIR/bin/packages/$ARCH/packages/${pkg}_"*.ipk ipks/ 2>/dev/null || \
          cp "$SDK_DIR/bin/packages/$ARCH/base/${pkg}_"*.ipk ipks/ 2>/dev/null || \
          echo "Note: $pkg not found"
        done
        ls -l ipks/

    - name: Upload QModem IPKs
      uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk

  # 3. Build quectel-timesync (using ImmortalWrt SDK action)
  build-quectel-timesync:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout quectel-timesync source
      uses: actions/checkout@v4
      with:
        repository: freifunk-darmstadt/quectel-timesync
        path: quectel-source

    - name: Build with ImmortalWrt SDK
      uses: immortalwrt/gh-action-sdk@master
      env:
        ARCH: mvebu-cortexa9-24.10.4
        NO_DEFAULT_FEEDS: 1
        FEED_DIR: quectel-source/openwrt
        PACKAGES: quectel-timesync

    - name: Collect IPKs
      run: |
        mkdir -p ipks
        find bin -name "quectel-timesync_*.ipk" -exec cp {} ipks/ \;
        ls -l ipks/

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: quectel-timesync-ipks
        path: ipks/*.ipk

  # 4. Build atc-fib-fm350_gl & luci-proto-atc (using ImmortalWrt SDK action)
  build-mrhaav:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mrhaav/packages
      uses: actions/checkout@v4
      with:
        repository: mrhaav/openwrt-packages
        path: mrhaav-source
        ref: main
        sparse-checkout: |
          atc-fib-fm350_gl
          luci/protocols/luci-proto-atc

    - name: Prepare feed directory
      run: |
        mkdir -p feed/atc-fib-fm350_gl feed/luci-proto-atc
        cp -r mrhaav-source/atc-fib-fm350_gl/* feed/atc-fib-fm350_gl/
        cp -r mrhaav-source/luci/protocols/luci-proto-atc/* feed/luci-proto-atc/

    - name: Build with ImmortalWrt SDK
      uses: immortalwrt/gh-action-sdk@master
      env:
        ARCH: mvebu-cortexa9-24.10.4
        NO_DEFAULT_FEEDS: 1
        FEED_DIR: feed
        PACKAGES: atc-fib-fm350_gl luci-proto-atc

    - name: Collect IPKs
      run: |
        mkdir -p ipks
        find bin -name "atc-fib-fm350_gl_*.ipk" -o -name "luci-proto-atc_*.ipk" | xargs -I{} cp {} ipks/
        ls -l ipks/

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: mrhaav-ipks
        path: ipks/*.ipk

  # 5. Combine all artifacts and create a single release
  release:
    needs: [build-qmodem, build-quectel-timesync, build-mrhaav]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all IPKs
      uses: actions/download-artifact@v4
      with:
        path: all-ipks

    - name: Flatten IPKs into single directory
      run: |
        mkdir -p release-ipks
        find all-ipks -name "*.ipk" -exec cp {} release-ipks/ \;
        echo "IPKs for release:"
        ls -l release-ipks/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-ipks/*
        tag_name: qmodem-24.10.4-${{ needs.build-qmodem.outputs.upstream_sha || github.run_number }}
        name: "QModem + extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.build-qmodem.outputs.upstream_sha || github.run_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
