name: Build QModem for ImmortalWrt 24.10.4 (Linksys WRT3200acm mvebu/cortexa9) TTTEEST CLAUDE

on:
  workflow_dispatch:

jobs:
  # ---------- Job 1: Check QModem upstream changes ----------
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
    # BUG FIX #1: Cache restore MUST come BEFORE the check step that reads the file.
    # In the original workflow these two steps were reversed, so .last_built_sha was
    # never on disk when the check ran — making every run look like a new commit.
    - name: Restore last built SHA cache
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-24.10.4-

    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        echo "Latest upstream SHA: $LATEST_SHA"
        echo "Last built SHA:      $LAST_BUILT_SHA"
        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected. Triggering build."
          echo "build_needed=true"  >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits. Skipping build."
          echo "build_needed=false" >> "$GITHUB_OUTPUT"
        fi

  # ---------- Job 2: Build QModem Userspace + Core Kernel Modules ----------
  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout QModem source
      uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        path: qmodem-source
        ref: main

    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
        key: sdk-mvebu-cortexa9-24.10.4-v1

    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_TARBALL="immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/$SDK_TARBALL"
        wget -q "$SDK_URL"
        tar --zstd -xf "$SDK_TARBALL"
        rm -f "$SDK_TARBALL"

    - name: Set SDK_DIR environment variable
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64)
        echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

    - name: Set up feeds (QModem + essential ImmortalWrt feeds)
      run: |
        cd "$SDK_DIR"

        # Remove any stale base feed symlink and config to start clean
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default

        # BUG FIX #2 (context): The qmodem src-link feed must be listed FIRST so
        # that its packages (driver/, application/, luci/) are discoverable by the
        # feed scanner before the luci/packages feeds are installed.
        printf '%s\n' "src-link qmodem ${{ github.workspace }}/qmodem-source"           >> feeds.conf.default
        printf '%s\n' "src-git luci     https://github.com/immortalwrt/luci.git;openwrt-24.10"     >> feeds.conf.default
        printf '%s\n' "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default

        ./scripts/feeds update -a

        # WORKAROUND: Remove conflicting package that causes circular dep in feeds
        rm -rf feeds/luci/applications/luci-app-diskman

        ./scripts/feeds install -a

        echo "=== Feed symlinks created for qmodem packages ==="
        ls package/feeds/qmodem/ | sort

    - name: Configure and build QModem packages
      run: |
        cd "$SDK_DIR"

        # ---------------------------------------------------------------
        # BUG FIX #3 – CONFIG_PACKAGE keys must use the EXACT KernelPackage
        # name, which PRESERVES UNDERSCORES.  The original workflow used
        # dashes (kmod-qmi-wwan-q) but the Makefile defines:
        #   KernelPackage/qmi_wwan_q  →  CONFIG_PACKAGE_kmod-qmi_wwan_q
        #   KernelPackage/qmi_wwan_f  →  CONFIG_PACKAGE_kmod-qmi_wwan_f
        #   KernelPackage/qmi_wwan_s  →  CONFIG_PACKAGE_kmod-qmi_wwan_s
        #   KernelPackage/pcie_mhi    →  CONFIG_PACKAGE_kmod-pcie_mhi
        # ---------------------------------------------------------------

        # 1. Core kernel dependency stubs (satisfy defconfig checks)
        echo "CONFIG_PACKAGE_kmod-usb-core=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-mii=m"       >> .config

        # 2. Select vendor kernel modules — correct underscore names
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
        echo "CONFIG_PACKAGE_kmod-pcie_mhi=m"   >> .config

        # 3. Select userspace applications
        echo "CONFIG_PACKAGE_quectel-CM-5G-M=m"         >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-next=m"    >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config
        # BUG FIX #4: Removed bogus/non-existent config key:
        #   CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y
        # That key does not exist in any Makefile and caused defconfig to silently
        # discard the config block, which in turn deselected kmod packages.

        # 4. Resolve and write final .config
        make defconfig

        # 5. DIAGNOSTIC: Verify targets survived defconfig dependency resolution
        echo "=== VERIFYING BUILD CONFIGURATION ==="
        grep -E "CONFIG_PACKAGE_kmod-(qmi_wwan|pcie_mhi)" .config || true
        grep -E "CONFIG_PACKAGE_(luci-app-qmodem|quectel-CM)" .config   || true
        echo "====================================="

        # ---------------------------------------------------------------
        # BUG FIX #5 – make package/NAME/compile MUST use the DIRECTORY
        # NAME that feeds install created under package/feeds/qmodem/, NOT
        # the PKG_NAME field inside the Makefile.
        #
        # After `feeds install -a` the SDK symlink layout is:
        #   package/feeds/qmodem/quectel_QMI_WWAN/  (PKG_NAME=qmi_wwan_q)
        #   package/feeds/qmodem/fibocom_QMI_WWAN/  (PKG_NAME=qmi_wwan_f)
        #   package/feeds/qmodem/simcom_QMI_WWAN/   (PKG_NAME=qmi_wwan_s)
        #   package/feeds/qmodem/quectel_MHI/       (PKG_NAME=pcie_mhi)
        #
        # The original workflow used `make package/qmi_wwan_q/compile` etc.
        # Those paths do not exist → make fails silently or errors out,
        # producing no .ko / .ipk output at all.
        # ---------------------------------------------------------------

        # 6. Compile vendor kernel drivers (use DIRECTORY names)
        make package/feeds/qmodem/quectel_QMI_WWAN/compile V=s 2>&1 | tail -5
        make package/feeds/qmodem/fibocom_QMI_WWAN/compile V=s 2>&1 | tail -5
        make package/feeds/qmodem/simcom_QMI_WWAN/compile  V=s 2>&1 | tail -5
        make package/feeds/qmodem/quectel_MHI/compile      V=s 2>&1 | tail -5

        # 7. Compile userspace applications (directory names are self-descriptive here)
        make package/feeds/qmodem/quectel_CM_5G_M/compile       V=s 2>&1 | tail -5
        make package/feeds/qmodem/luci-app-qmodem-next/compile  V=s 2>&1 | tail -5
        make package/feeds/qmodem/luci-app-qmodem-monitor/compile V=s 2>&1 | tail -5

    - name: Collect QModem + dependency IPKs
      run: |
        mkdir -p ipks

        # mvebu cortexa9 arch string used in the packages/ output path
        ARCH="arm_cortex-a9_vfpv3-d16"

        # -------------------------------------------------------------------
        # BUG FIX #6 – IPK filenames use the KernelPackage NAME with
        # UNDERSCORES preserved, NOT dashes.
        #   kmod-qmi_wwan_q_*.ipk  (not kmod-qmi-wwan-q_*.ipk)
        #   kmod-qmi_wwan_f_*.ipk
        #   kmod-qmi_wwan_s_*.ipk
        #   kmod-pcie_mhi_*.ipk    (already had correct underscore)
        #
        # Kernel module IPKs land under bin/targets/ (not bin/packages/) in
        # SDK builds; the recursive find handles both locations safely.
        # -------------------------------------------------------------------

        # 1. Collect vendor kmod IPKs (correct underscore names)
        find "$SDK_DIR/bin" \( \
          -name "kmod-qmi_wwan_q_*.ipk" -o \
          -name "kmod-qmi_wwan_f_*.ipk" -o \
          -name "kmod-qmi_wwan_s_*.ipk" -o \
          -name "kmod-pcie_mhi_*.ipk"   \
        \) -exec cp {} ipks/ \;

        # 2. Collect all qmodem-feed userspace IPKs
        cp "$SDK_DIR/bin/packages/$ARCH/qmodem/"*.ipk ipks/ 2>/dev/null || true

        # 3. Pull in essential runtime dependency IPKs
        for pkg in curl terminfo bc coreutils coreutils-stat usbutils; do
          cp "$SDK_DIR/bin/packages/$ARCH/packages/${pkg}_"*.ipk ipks/ 2>/dev/null || \
          cp "$SDK_DIR/bin/packages/$ARCH/base/${pkg}_"*.ipk     ipks/ 2>/dev/null || \
          echo "Note: $pkg not found (may be provided by base firmware)"
        done

        echo "=== FINAL IPK LIST ==="
        ls -lh ipks/
        echo "Kmod IPKs found:"
        ls ipks/kmod-*.ipk 2>/dev/null || echo "  WARNING: No kmod IPKs collected!"

    - name: Upload QModem IPKs
      uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk

  # ---------- Job 3: Combine and Release ----------
  release:
    needs: [check-and-build, build-qmodem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download QModem IPKs
      uses: actions/download-artifact@v4
      with:
        name: qmodem-ipks
        path: release-ipks

    - name: Verify IPKs for release
      run: |
        echo "Files ready to publish:"
        ls -lh release-ipks/
        echo "Kmod IPKs:"
        ls release-ipks/kmod-*.ipk 2>/dev/null || echo "WARNING: no kmod IPKs found!"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-ipks/*
        tag_name: qmodem-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
        name: "QModem for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
