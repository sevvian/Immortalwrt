name: Build QModem TEST COMBINED ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SDK_DIR: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
  SDK_TARBALL: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  SDK_URL: https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  ARCH: arm_cortex-a9_vfpv3-d16

jobs:

  # =========================================================
  # CHECK UPSTREAM
  # =========================================================
  check-and-build:
    runs-on: ubuntu-latest

    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}

    steps:

    - name: Restore last built SHA cache
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-24.10.4-

    - name: Check latest upstream commit
      id: check
      shell: bash
      run: |
        set -e

        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"

        LATEST_SHA=$(curl -fsSL "$API_URL" | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || true)

        FORCE="${{ github.event.inputs.force_rebuild }}"

        echo "Latest upstream SHA : $LATEST_SHA"
        echo "Last built SHA      : $LAST_BUILT_SHA"
        echo "Force rebuild       : $FORCE"

        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New upstream commit detected."

          echo "build_needed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"

          echo "$LATEST_SHA" > .last_built_sha

        elif [ "$FORCE" = "true" ]; then
          echo "Force rebuild enabled."

          echo "build_needed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"

          echo "$LATEST_SHA" > .last_built_sha

        else
          echo "No upstream changes."

          echo "build_needed=false" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
        fi

  # =========================================================
  # BUILD QMODEM + KMODS
  # =========================================================
  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout QModem source
      uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        ref: main
        path: qmodem-source

    - name: Install build dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3-dev \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          zstd \
          jq

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: sdk-mvebu-cortexa9-24.10.4-v2

    - name: Download SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -q "${{ env.SDK_URL }}"
        tar --zstd -xf "${{ env.SDK_TARBALL }}"
        rm -f "${{ env.SDK_TARBALL }}"

    - name: Configure feeds
      run: |
        cd "${{ env.SDK_DIR }}"

        rm -f feeds.conf
        rm -f feeds.conf.default

        printf '%s\n' \
          "src-link qmodem ${{ github.workspace }}/qmodem-source" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" \
          >> feeds.conf.default

        ./scripts/feeds update -a

        rm -rf feeds/luci/applications/luci-app-diskman

        ./scripts/feeds install -a

    - name: Configure build
      run: |
        cd "${{ env.SDK_DIR }}"

        echo "CONFIG_PACKAGE_kmod-usb-core=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=m" >> .config
        echo "CONFIG_PACKAGE_kmod-mii=m" >> .config

        echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
        echo "CONFIG_PACKAGE_kmod-pcie_mhi=m" >> .config

        echo "CONFIG_PACKAGE_qmodem=m" >> .config
        echo "CONFIG_PACKAGE_qmodem_monitor=m" >> .config
        echo "CONFIG_PACKAGE_tom_modem=m" >> .config
        echo "CONFIG_PACKAGE_ubus-at-daemon=m" >> .config
        echo "CONFIG_PACKAGE_sms-tool_q=m" >> .config
        echo "CONFIG_PACKAGE_sms-forwarder-next=m" >> .config
        echo "CONFIG_PACKAGE_quectel-CM-5G-M=m" >> .config

        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y" >> .config

        echo "CONFIG_PACKAGE_luci-app-qmodem-next=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config

        make defconfig

    - name: Build packages
      run: |
        cd "${{ env.SDK_DIR }}"

        make -j$(nproc) package/compile IGNORE_ERRORS=m V=s

    - name: Collect IPKs
      run: |
        mkdir -p ipks

        find "${{ env.SDK_DIR }}/bin" \( \
          -name "kmod-qmi_wwan_q_*.ipk" -o \
          -name "kmod-qmi_wwan_f_*.ipk" -o \
          -name "kmod-qmi_wwan_s_*.ipk" -o \
          -name "kmod-pcie_mhi_*.ipk" \
        \) -exec cp {} ipks/ \;

        find "${{ env.SDK_DIR }}/bin/packages/${{ env.ARCH }}/qmodem" \
          -name "*.ipk" \
          -exec cp {} ipks/ \; 2>/dev/null || true

        echo "Collected IPKs:"
        ls -lh ipks/

    - name: Upload QModem IPKs
      uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk

  # =========================================================
  # BUILD QUECTEL-TIMESYNC
  # =========================================================
  build-quectel-timesync:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        repository: sevvian/quectel-timesync
        ref: master
        path: quectel-source

    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: sdk-mvebu-cortexa9-24.10.4-v2

    - name: Download SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -q "${{ env.SDK_URL }}"
        tar --zstd -xf "${{ env.SDK_TARBALL }}"
        rm -f "${{ env.SDK_TARBALL }}"

    - name: Copy packages
      run: |
        cp -r \
          quectel-source/openwrt/quectel-timesync \
          "${{ env.SDK_DIR }}/package/quectel-timesync"

        cp -r \
          quectel-source/luci-app-quectel-timesync \
          "${{ env.SDK_DIR }}/package/luci-app-quectel-timesync"

    - name: Update feeds
      run: |
        cd "${{ env.SDK_DIR }}"

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build packages
      run: |
        cd "${{ env.SDK_DIR }}"

        echo "CONFIG_PACKAGE_quectel-timesync=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-quectel-timesync=m" >> .config

        make defconfig

        make package/quectel-timesync/compile V=s
        make package/luci-app-quectel-timesync/compile V=s

    - name: Collect IPKs
      run: |
        mkdir -p ipks

        find "${{ env.SDK_DIR }}/bin" \( \
          -name "quectel-timesync_*.ipk" -o \
          -name "luci-app-quectel-timesync_*.ipk" \
        \) -exec cp {} ipks/ \;

        ls -lh ipks/

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: quectel-timesync-ipks
        path: ipks/*.ipk

  # =========================================================
  # BUILD MRHAAV PACKAGES
  # =========================================================
  build-mrhaav:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        repository: mrhaav/openwrt-packages
        ref: main
        path: mrhaav-source
        sparse-checkout: |
          atc-fib-fm350_gl
          luci/protocols/luci-proto-atc

    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: sdk-mvebu-cortexa9-24.10.4-v2

    - name: Download SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -q "${{ env.SDK_URL }}"
        tar --zstd -xf "${{ env.SDK_TARBALL }}"
        rm -f "${{ env.SDK_TARBALL }}"

    - name: Create feed structure
      run: |
        mkdir -p mrhaavfeed/atc-fib-fm350_gl
        mkdir -p mrhaavfeed/luci-proto-atc

        cp -r \
          mrhaav-source/atc-fib-fm350_gl/* \
          mrhaavfeed/atc-fib-fm350_gl/

        cp -r \
          mrhaav-source/luci/protocols/luci-proto-atc/* \
          mrhaavfeed/luci-proto-atc/

    - name: Configure feeds
      run: |
        cd "${{ env.SDK_DIR }}"

        rm -f feeds.conf
        rm -f feeds.conf.default

        printf '%s\n' \
          "src-link mrhaavfeed ${{ github.workspace }}/mrhaavfeed" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" \
          >> feeds.conf.default

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build packages
      run: |
        cd "${{ env.SDK_DIR }}"

        echo "CONFIG_PACKAGE_atc-fib-fm350_gl=m" >> .config
        echo "CONFIG_PACKAGE_luci-proto-atc=m" >> .config

        make defconfig

        make package/feeds/mrhaavfeed/atc-fib-fm350_gl/compile V=s
        make package/feeds/mrhaavfeed/luci-proto-atc/compile V=s

    - name: Collect IPKs
      run: |
        mkdir -p ipks

        find "${{ env.SDK_DIR }}/bin" \( \
          -name "atc-fib-fm350_gl_*.ipk" -o \
          -name "luci-proto-atc_*.ipk" \
        \) -exec cp {} ipks/ \;

        ls -lh ipks/

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: mrhaav-ipks
        path: ipks/*.ipk

  # =========================================================
  # BUILD ARGON
  # =========================================================
  build-argon:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Argon theme
      uses: actions/checkout@v4
      with:
        repository: jerrykuku/luci-theme-argon
        ref: master
        path: argon-theme-source

    - name: Checkout Argon config
      uses: actions/checkout@v4
      with:
        repository: jerrykuku/luci-app-argon-config
        ref: master
        path: argon-config-source

    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          zstd

    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: sdk-mvebu-cortexa9-24.10.4-v2

    - name: Download SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -q "${{ env.SDK_URL }}"
        tar --zstd -xf "${{ env.SDK_TARBALL }}"
        rm -f "${{ env.SDK_TARBALL }}"

    - name: Create feed structure
      run: |
        mkdir -p argonfeed/luci-theme-argon
        mkdir -p argonfeed/luci-app-argon-config

        cp -r \
          argon-theme-source/* \
          argonfeed/luci-theme-argon/

        cp -r \
          argon-config-source/* \
          argonfeed/luci-app-argon-config/

    - name: Configure feeds
      run: |
        cd "${{ env.SDK_DIR }}"

        rm -f feeds.conf
        rm -f feeds.conf.default

        printf '%s\n' \
          "src-link argonfeed ${{ github.workspace }}/argonfeed" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" \
          >> feeds.conf.default

        printf '%s\n' \
          "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" \
          >> feeds.conf.default

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build packages
      run: |
        cd "${{ env.SDK_DIR }}"

        echo "CONFIG_PACKAGE_luci-theme-argon=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-argon-config=m" >> .config

        make defconfig

        make package/feeds/argonfeed/luci-theme-argon/compile V=s
        make package/feeds/argonfeed/luci-app-argon-config/compile V=s

    - name: Collect IPKs
      run: |
        mkdir -p ipks

        find "${{ env.SDK_DIR }}/bin" \( \
          -name "luci-theme-argon_*.ipk" -o \
          -name "luci-app-argon-config_*.ipk" \
        \) -exec cp {} ipks/ \;

        ls -lh ipks/

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: argon-ipks
        path: ipks/*.ipk

  # =========================================================
  # RELEASE
  # =========================================================
  release:
    needs:
      - check-and-build
      - build-qmodem
      - build-quectel-timesync
      - build-mrhaav
      - build-argon

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-ipks

    - name: Flatten IPKs
      run: |
        mkdir -p release-ipks

        find all-ipks -name "*.ipk" \
          -exec cp {} release-ipks/ \;

        ls -lh release-ipks/

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release-ipks/*
        tag_name: qmodem-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
        name: QModem + Extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) - ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
