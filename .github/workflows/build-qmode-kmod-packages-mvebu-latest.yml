name: Build QModem + Extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) - TEST VERSIOON COMBINED

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
    - name: Restore last built SHA cache
      uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
        restore-keys: |
          qmodem-last-built-sha-24.10.4-
    - name: Check latest upstream commit
      id: check
      run: |
        UPSTREAM_REPO="FUjr/QModem"
        API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
        LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
        LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
        FORCE="${{ github.event.inputs.force_rebuild }}"

        echo "Latest upstream SHA : $LATEST_SHA"
        echo "Last built SHA      : $LAST_BUILT_SHA"
        echo "Force rebuild       : $FORCE"

        if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
          echo "New commits detected — build triggered."
          echo "build_needed=true"        >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "$LATEST_SHA" > .last_built_sha
        elif [ "$FORCE" = "true" ]; then
          echo "No new commits, but force_rebuild=true — build triggered anyway."
          echo "build_needed=true"        >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          echo "$LATEST_SHA" > .last_built_sha
        else
          echo "No new commits and force_rebuild=false — skipping build."
          echo "build_needed=false" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
        fi

  # ---------- Job: QModem (kmods + all userspace) ----------
  build-qmodem:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout QModem source
      uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        path: qmodem-source
        ref: main
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses-dev libssl-dev python3-dev python3-setuptools \
          rsync unzip zlib1g-dev file wget zstd
    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-mvebu-cortexa9-24.10.4-v1
    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_TARBALL="immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/$SDK_TARBALL"
        wget -q "$SDK_URL"
        tar --zstd -xf "$SDK_TARBALL"
        rm -f "$SDK_TARBALL"
    - name: Set SDK_DIR environment variable
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
    - name: Set up feeds (QModem + essential ImmortalWrt feeds)
      run: |
        cd "$SDK_DIR"
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default
        printf '%s\n' "src-link qmodem   ${{ github.workspace }}/qmodem-source"                     >> feeds.conf.default
        printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10"     >> feeds.conf.default
        printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
        ./scripts/feeds update -a
        # WORKAROUND: Remove conflicting package that creates circular deps
        rm -rf feeds/luci/applications/luci-app-diskman
        ./scripts/feeds install -a
        echo "=== qmodem feed symlinks ==="
        ls package/feeds/qmodem/ | sort
    - name: Write .config and resolve dependencies
      run: |
        cd "$SDK_DIR"
        # Kernel USB stubs
        echo "CONFIG_PACKAGE_kmod-usb-core=m" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-usb-wdm=m"  >> .config
        echo "CONFIG_PACKAGE_kmod-mii=m"       >> .config
        # Vendor kernel modules
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
        echo "CONFIG_PACKAGE_kmod-pcie_mhi=m"   >> .config
        # QModem core userspace
        echo "CONFIG_PACKAGE_qmodem=m"             >> .config
        echo "CONFIG_PACKAGE_qmodem_monitor=m"     >> .config
        echo "CONFIG_PACKAGE_tom_modem=m"          >> .config
        echo "CONFIG_PACKAGE_ubus-at-daemon=m"     >> .config
        echo "CONFIG_PACKAGE_sms-tool_q=m"         >> .config
        echo "CONFIG_PACKAGE_sms-forwarder-next=m" >> .config
        echo "CONFIG_PACKAGE_quectel_CM_5G_M=m"   >> .config
        # Feature flags
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y"       >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y"        >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y"                >> .config
        # LuCI frontends
        echo "CONFIG_PACKAGE_luci-app-qmodem-next=m"    >> .config
        echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config
        make defconfig
        echo "=== FINAL BUILD CONFIG CHECK ==="
        grep -E "^CONFIG_PACKAGE_(kmod-qmi_wwan|kmod-pcie_mhi|qmodem|tom_modem|ubus-at|sms-|quectel|luci-app-qmodem)" \
             .config | sort
        echo "================================="
    - name: Build all QModem packages (kmods + userspace)
      run: |
        cd "$SDK_DIR"
        make -j$(nproc) package/compile IGNORE_ERRORS=m V=s 2>&1 | \
          grep -E "^(make\[1\].*Entering|make\[1\].*Leaving|time:|  ERROR|ERROR:)" || true
        echo ""
        echo "=== BUILD COMPLETE — key artefacts ==="
        find bin/ -name "kmod-qmi_wwan_*.ipk" -o -name "kmod-pcie_mhi_*.ipk" | sort
        find bin/ -name "qmodem_*.ipk" -o -name "tom_modem_*.ipk"             | sort
        find bin/ -name "luci-app-qmodem-*.ipk"                                | sort
        find bin/ -name "quectel-CM-5G-M_*.ipk"                               | sort
    - name: Collect QModem IPKs
      run: |
        mkdir -p ipks
        ARCH="arm_cortex-a9_vfpv3-d16"
        # Vendor kmod IPKs
        find "$SDK_DIR/bin" \( \
          -name "kmod-qmi_wwan_q_*.ipk" -o \
          -name "kmod-qmi_wwan_f_*.ipk" -o \
          -name "kmod-qmi_wwan_s_*.ipk" -o \
          -name "kmod-pcie_mhi_*.ipk"   \
        \) -exec cp {} ipks/ \;
        # All qmodem-feed userspace IPKs
        find "$SDK_DIR/bin/packages/$ARCH/qmodem/" -name "*.ipk" \
          -exec cp {} ipks/ \; 2>/dev/null || true
        echo "=== COLLECTED IPKs ==="
        ls -lh ipks/
        echo "Kmod IPKs:"
        ls ipks/kmod-*.ipk 2>/dev/null || echo "  WARNING: No kmod IPKs!"
        echo "Userspace IPKs:"
        ls ipks/*.ipk 2>/dev/null | grep -v kmod || echo "  WARNING: No userspace IPKs!"
        [ "$(ls ipks/*.ipk 2>/dev/null | wc -l)" -gt 0 ] || \
          { echo "FATAL: Zero IPKs collected"; exit 1; }
    - name: Upload QModem IPKs
      uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk

  # ---------- Job: quectel-timesync ----------
  build-quectel-timesync:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout quectel-timesync source (sevvian fork)
      uses: actions/checkout@v4
      with:
        repository: sevvian/quectel-timesync
        path: quectel-source
        ref: master
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-mvebu-cortexa9-24.10.4-v1
    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
    - name: Copy packages into SDK
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cp -r quectel-source/openwrt/quectel-timesync "$SDK_DIR/package/quectel-timesync"
        cp -r quectel-source/luci-app-quectel-timesync "$SDK_DIR/package/luci-app-quectel-timesync"
    - name: Update SDK feeds (needed for dependencies)
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        rm -rf feeds/base
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Build packages
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        echo "CONFIG_PACKAGE_quectel-timesync=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-quectel-timesync=m" >> .config
        make defconfig
        make package/quectel-timesync/compile V=s
        make package/luci-app-quectel-timesync/compile V=s
    - name: Collect IPKs
      run: |
        mkdir -p ipks
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        ARCH="arm_cortex-a9_vfpv3-d16"
        cp "$SDK_DIR/bin/packages/$ARCH/base/"quectel-timesync_*.ipk ipks/ 2>/dev/null || true
        cp "$SDK_DIR/bin/packages/$ARCH/luci/"luci-app-quectel-timesync_*.ipk ipks/ 2>/dev/null || true
        find "$SDK_DIR/bin" -name "quectel-timesync_*.ipk" -exec cp {} ipks/ \;
        find "$SDK_DIR/bin" -name "luci-app-quectel-timesync_*.ipk" -exec cp {} ipks/ \;
        ls -l ipks/
    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: quectel-timesync-ipks
        path: ipks/*.ipk

  # ---------- Job: mrhaav (atc-fib-fm350_gl + luci-proto-atc) ----------
  build-mrhaav:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mrhaav/packages
      uses: actions/checkout@v4
      with:
        repository: mrhaav/openwrt-packages
        path: mrhaav-source
        ref: main
        sparse-checkout: |
          atc-fib-fm350_gl
          luci/protocols/luci-proto-atc
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-mvebu-cortexa9-24.10.4-v1
    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
    - name: Create proper feed directory structure
      run: |
        mkdir -p mrhaavfeed/atc-fib-fm350_gl
        mkdir -p mrhaavfeed/luci-proto-atc
        cp -r mrhaav-source/atc-fib-fm350_gl/* mrhaavfeed/atc-fib-fm350_gl/
        cp -r mrhaav-source/luci/protocols/luci-proto-atc/* mrhaavfeed/luci-proto-atc/
    - name: Set up feeds (mrhaav feed + essential ImmortalWrt)
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default
        printf '%s\n' "src-link mrhaavfeed ${{ github.workspace }}/mrhaavfeed" >> feeds.conf.default
        printf '%s\n' "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
        printf '%s\n' "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Build packages
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        echo "CONFIG_PACKAGE_atc-fib-fm350_gl=m" >> .config
        echo "CONFIG_PACKAGE_luci-proto-atc=m" >> .config
        make defconfig
        make package/feeds/mrhaavfeed/atc-fib-fm350_gl/compile V=s
        make package/feeds/mrhaavfeed/luci-proto-atc/compile V=s
    - name: Collect IPKs
      run: |
        mkdir -p ipks
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        ARCH="arm_cortex-a9_vfpv3-d16"
        cp "$SDK_DIR/bin/packages/$ARCH/mrhaavfeed/"*.ipk ipks/ 2>/dev/null || true
        find "$SDK_DIR/bin" -name "atc-fib-fm350_gl_*.ipk" -o -name "luci-proto-atc_*.ipk" | xargs -I{} cp {} ipks/
        ls -l ipks/
    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: mrhaav-ipks
        path: ipks/*.ipk

  # ---------- Job: Argon Theme + Config ----------
  build-argon:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout luci-theme-argon source
      uses: actions/checkout@v4
      with:
        repository: jerrykuku/luci-theme-argon
        path: argon-theme-source
        ref: master
    - name: Checkout luci-app-argon-config source
      uses: actions/checkout@v4
      with:
        repository: jerrykuku/luci-app-argon-config
        path: argon-config-source
        ref: master
    - name: Prepare build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-dev python3-setuptools rsync unzip zlib1g-dev file wget zstd
    - name: Restore SDK cache
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: immortalwrt-sdk-*
        key: sdk-mvebu-cortexa9-24.10.4-v1
    - name: Download & extract SDK (24.10.4)
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        SDK_URL="https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst"
        wget -q "$SDK_URL"
        tar --zstd -xf immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
    - name: Create proper feed directory structure
      run: |
        mkdir -p argonfeed/luci-theme-argon
        mkdir -p argonfeed/luci-app-argon-config
        cp -r argon-theme-source/* argonfeed/luci-theme-argon/
        cp -r argon-config-source/* argonfeed/luci-app-argon-config/
    - name: Set up feeds (argon feed + essential ImmortalWrt)
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        rm -rf feeds/base
        rm -f feeds.conf feeds.conf.default
        printf '%s\n' "src-link argonfeed ${{ github.workspace }}/argonfeed" >> feeds.conf.default
        printf '%s\n' "src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10" >> feeds.conf.default
        printf '%s\n' "src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Build packages
      run: |
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        cd "$SDK_DIR"
        echo "CONFIG_PACKAGE_luci-theme-argon=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-argon-config=m" >> .config
        make defconfig
        make package/feeds/argonfeed/luci-theme-argon/compile V=s
        make package/feeds/argonfeed/luci-app-argon-config/compile V=s
    - name: Collect IPKs
      run: |
        mkdir -p ipks
        SDK_DIR=$(ls -d immortalwrt-sdk-*)
        ARCH="arm_cortex-a9_vfpv3-d16"
        cp "$SDK_DIR/bin/packages/$ARCH/argonfeed/"*.ipk ipks/ 2>/dev/null || true
        find "$SDK_DIR/bin" -name "luci-theme-argon_*.ipk" -o -name "luci-app-argon-config_*.ipk" | xargs -I{} cp {} ipks/
        ls -l ipks/
    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: argon-ipks
        path: ipks/*.ipk

  # ---------- Release ----------
  release:
    needs: [check-and-build, build-qmodem, build-quectel-timesync, build-mrhaav, build-argon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all IPKs
      uses: actions/download-artifact@v4
      with:
        path: all-ipks
    - name: Flatten IPKs into single directory
      run: |
        mkdir -p release-ipks
        find all-ipks -name "*.ipk" -exec cp {} release-ipks/ \;
        echo "IPKs for release:"
        ls -l release-ipks/
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-ipks/*
        tag_name: qmodem-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
        name: "QModem + extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
