name: Build QModem TEST ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SDK_NAME: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
  SDK_TAR: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  SDK_URL: https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  ARCH: arm_cortex-a9_vfpv3-d16

jobs:

  # =======================  CHECK UPSTREAM SHA  =============================
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Restore last built SHA cache
        uses: actions/cache@v4
        with:
          path: .last_built_sha
          key: qmodem-last-built-sha-24.10.4-${{ github.run_id }}
          restore-keys: |
            qmodem-last-built-sha-24.10.4-

      - name: Check latest upstream commit
        id: check
        run: |
          UPSTREAM_REPO="FUjr/QModem"
          API_URL="https://api.github.com/repos/$UPSTREAM_REPO/commits/main"
          LATEST_SHA=$(curl -s "$API_URL" | jq -r '.sha')
          LAST_BUILT_SHA=$(cat .last_built_sha 2>/dev/null || echo "")
          FORCE="${{ github.event.inputs.force_rebuild }}"

          if [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ] || [ "$FORCE" = "true" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .last_built_sha
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          fi

  # =======================  UNIFIED BUILD JOB  ==============================
  build-all:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      # --- Checkout all sources ---
      - name: Checkout QModem source
        uses: actions/checkout@v4
        with:
          repository: FUjr/QModem
          path: qmodem-source
          ref: main

      - name: Checkout quectel-timesync
        uses: actions/checkout@v4
        with:
          repository: sevvian/quectel-timesync
          path: quectel-source
          ref: master

      - name: Checkout mrhaav packages
        uses: actions/checkout@v4
        with:
          repository: mrhaav/openwrt-packages
          path: mrhaav-source
          ref: main
          sparse-checkout: |
            atc-fib-fm350_gl
            luci/protocols/luci-proto-atc

      - name: Checkout Argon theme
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-theme-argon
          path: luci-theme-argon
          ref: master

      - name: Checkout Argon config
        uses: actions/checkout@v4
        with:
          repository: jerrykuku/luci-app-argon-config
          path: luci-app-argon-config
          ref: master

      # --- Prepare SDK ---
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_NAME }}
          key: sdk-mvebu-cortexa9-24.10.4-v4

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.SDK_URL }}"
          tar --zstd -xf "${{ env.SDK_TAR }}"
          rm -f "${{ env.SDK_TAR }}"

      # --- Place external packages into the SDK’s package/ directory ---
      - name: Place external packages into SDK
        run: |
          # quectel-timesync
          cp -r quectel-source/openwrt/quectel-timesync "${{ env.SDK_NAME }}/package/quectel-timesync"
          cp -r quectel-source/luci-app-quectel-timesync "${{ env.SDK_NAME }}/package/luci-app-quectel-timesync"

          # mrhaav packages
          mkdir -p "${{ env.SDK_NAME }}/package/atc-fib-fm350_gl"
          cp -r mrhaav-source/atc-fib-fm350_gl/* "${{ env.SDK_NAME }}/package/atc-fib-fm350_gl/"
          mkdir -p "${{ env.SDK_NAME }}/package/luci-proto-atc"
          cp -r mrhaav-source/luci/protocols/luci-proto-atc/* "${{ env.SDK_NAME }}/package/luci-proto-atc/"

          # Argon
          cp -r luci-theme-argon "${{ env.SDK_NAME }}/package/luci-theme-argon"
          cp -r luci-app-argon-config "${{ env.SDK_NAME }}/package/luci-app-argon-config"

      # --- Configure feeds and work around diskman recursion ---
      - name: Set up feeds and remove diskman
        run: |
          cd ${{ env.SDK_NAME }}
          rm -rf feeds/base
          rm -f feeds.conf feeds.conf.default

          printf '%s\n' "src-link qmodem   ${{ github.workspace }}/qmodem-source"                     >> feeds.conf.default
          printf '%s\n' "src-git  luci     https://github.com/immortalwrt/luci.git;openwrt-24.10"     >> feeds.conf.default
          printf '%s\n' "src-git  packages https://github.com/immortalwrt/packages.git;openwrt-24.10" >> feeds.conf.default

          ./scripts/feeds update -a

          # CRITICAL: remove diskman to break recursive dependency
          rm -rf feeds/luci/applications/luci-app-diskman

          ./scripts/feeds install -a

      # --- Write minimal .config with all required symbols ---
      - name: Configure build
        run: |
          cd ${{ env.SDK_NAME }}

          # Start fresh
          cat > .config <<EOF
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_DEVEL=y
          EOF

          # Kernel stubs
          echo "CONFIG_PACKAGE_kmod-usb-core=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net=m"  >> .config
          echo "CONFIG_PACKAGE_kmod-usb-wdm=m"  >> .config
          echo "CONFIG_PACKAGE_kmod-mii=m"      >> .config

          # QModem vendor kmods
          echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
          echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
          echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
          echo "CONFIG_PACKAGE_kmod-pcie_mhi=m"   >> .config

          # QModem userspace
          echo "CONFIG_PACKAGE_qmodem=m"             >> .config
          echo "CONFIG_PACKAGE_qmodem_monitor=m"     >> .config
          echo "CONFIG_PACKAGE_tom_modem=m"          >> .config
          echo "CONFIG_PACKAGE_ubus-at-daemon=m"     >> .config
          echo "CONFIG_PACKAGE_sms-tool_q=m"         >> .config
          echo "CONFIG_PACKAGE_sms-forwarder-next=m" >> .config
          echo "CONFIG_PACKAGE_quectel_CM_5G_M=m"    >> .config

          # Feature flags
          echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_vendor-qmi-wwan=y"       >> .config
          echo "CONFIG_PACKAGE_luci-app-qmodem_VENDOR_MHI_PCIe_DRIVER=y"        >> .config
          echo "CONFIG_PACKAGE_luci-app-qmodem_USE_TOM_CUSTOMIZED_QUECTEL_CM=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_ndisc6=y"                >> .config

          # QModem LuCI frontends
          echo "CONFIG_PACKAGE_luci-app-qmodem-next=m"    >> .config
          echo "CONFIG_PACKAGE_luci-app-qmodem-monitor=m" >> .config

          # quectel-timesync
          echo "CONFIG_PACKAGE_quectel-timesync=m"       >> .config
          echo "CONFIG_PACKAGE_luci-app-quectel-timesync=m" >> .config

          # mrhaav
          echo "CONFIG_PACKAGE_atc-fib-fm350_gl=m"   >> .config
          echo "CONFIG_PACKAGE_luci-proto-atc=m"     >> .config

          # Argon
          echo "CONFIG_PACKAGE_luci-theme-argon=m"       >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=m"  >> .config

          make defconfig

          # Verify that all packages are enabled
          echo "=== FINAL CONFIG CHECK ==="
          grep -E "^CONFIG_PACKAGE_(kmod-qmi_wwan|kmod-pcie_mhi|qmodem|tom_modem|ubus-at|sms-|quectel|luci-app-qmodem|luci-theme-argon|luci-app-argon-config|atc-fib|luci-proto-atc)" \
               .config | sort

      # --- Build each package individually (proven working pattern) ---
      - name: Build QModem kmods
        run: |
          cd ${{ env.SDK_NAME }}
          make package/kmod-qmi_wwan_q/compile V=s
          make package/kmod-qmi_wwan_f/compile V=s
          make package/kmod-qmi_wwan_s/compile V=s
          make package/kmod-pcie_mhi/compile V=s

      - name: Build QModem userspace packages
        run: |
          cd ${{ env.SDK_NAME }}
          make package/qmodem/compile V=s
          make package/qmodem_monitor/compile V=s
          make package/tom_modem/compile V=s
          make package/ubus-at-daemon/compile V=s
          make package/sms-tool_q/compile V=s
          make package/sms-forwarder-next/compile V=s
          make package/quectel_CM_5G_M/compile V=s
          make package/luci-app-qmodem-next/compile V=s
          make package/luci-app-qmodem-monitor/compile V=s

      - name: Build quectel-timesync
        run: |
          cd ${{ env.SDK_NAME }}
          make package/quectel-timesync/compile V=s
          make package/luci-app-quectel-timesync/compile V=s

      - name: Build mrhaav packages
        run: |
          cd ${{ env.SDK_NAME }}
          make package/atc-fib-fm350_gl/compile V=s
          make package/luci-proto-atc/compile V=s

      - name: Build Argon theme and config
        run: |
          cd ${{ env.SDK_NAME }}
          make package/luci-theme-argon/compile V=s
          make package/luci-app-argon-config/compile V=s

      # --- Collect all IPKs ---
      - name: Collect all IPKs
        run: |
          mkdir -p ipks
          ARCH="${{ env.ARCH }}"
          SDK_DIR="${{ env.SDK_NAME }}"

          # Vendor kmods
          find "$SDK_DIR/bin" \( \
            -name "kmod-qmi_wwan_q_*.ipk" -o \
            -name "kmod-qmi_wwan_f_*.ipk" -o \
            -name "kmod-qmi_wwan_s_*.ipk" -o \
            -name "kmod-pcie_mhi_*.ipk"   \
          \) -exec cp {} ipks/ \;

          # QModem userspace from qmodem feed
          find "$SDK_DIR/bin/packages/$ARCH/qmodem/" -name "*.ipk" \
            -exec cp {} ipks/ \; 2>/dev/null || true

          # Packages that land in base/
          for pkg in quectel-timesync luci-app-quectel-timesync \
                     atc-fib-fm350_gl luci-proto-atc \
                     luci-theme-argon luci-app-argon-config \
                     qmodem tom_modem quectel-CM-5G-M \
                     luci-app-qmodem-next luci-app-qmodem-monitor; do
            find "$SDK_DIR/bin/packages/$ARCH/base/" -name "${pkg}_*.ipk" \
              -exec cp {} ipks/ \; 2>/dev/null || true
            find "$SDK_DIR/bin" -name "${pkg}_*.ipk" \
              -exec cp {} ipks/ \; 2>/dev/null || true
          done

          echo "=== Collected IPKs ==="
          ls -lh ipks/
          [ "$(ls -A ipks/)" ] || { echo "FATAL: Zero IPKs collected"; exit 1; }

      - name: Upload all IPKs
        uses: actions/upload-artifact@v4
        with:
          name: all-ipks
          path: ipks/*.ipk

  # =======================  RELEASE  =======================================
  release:
    needs: [check-and-build, build-all]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all IPKs
        uses: actions/download-artifact@v4
        with:
          name: all-ipks
          path: release-ipks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-ipks/*
          tag_name: qmodem-extras-24.10.4-${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}
          name: "QModem + Extras for ImmortalWrt 24.10.4 (mvebu/cortexa9) – ${{ needs.check-and-build.outputs.upstream_sha || github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
