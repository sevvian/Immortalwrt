name: Build QModem TEST COMBINED ImmortalWrt 24.10.4 (mvebu/cortexa9)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream SHA has not changed'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SDK_DIR: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64
  SDK_TARBALL: immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  SDK_URL: https://downloads.immortalwrt.org/releases/24.10.4/targets/mvebu/cortexa9/immortalwrt-sdk-24.10.4-mvebu-cortexa9_gcc-13.3.0_musl_eabi.Linux-x86_64.tar.zst
  ARCH: arm_cortex-a9_vfpv3-d16

jobs:

# =========================================================
# CHECK
# =========================================================
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}

    steps:
    - uses: actions/cache@v4
      with:
        path: .last_built_sha
        key: qmodem-last-built-sha

    - id: check
      run: |
        set -e
        API="https://api.github.com/repos/FUjr/QModem/commits/main"
        LATEST=$(curl -s $API | jq -r .sha)
        LAST=$(cat .last_built_sha 2>/dev/null || true)

        FORCE="${{ github.event.inputs.force_rebuild }}"

        echo "LATEST=$LATEST"
        echo "LAST=$LAST"

        if [ "$LATEST" != "$LAST" ] || [ "$FORCE" = "true" ]; then
          echo "build_needed=true" >> $GITHUB_OUTPUT
          echo "$LATEST" > .last_built_sha
        else
          echo "build_needed=false" >> $GITHUB_OUTPUT
        fi

        echo "upstream_sha=$LATEST" >> $GITHUB_OUTPUT

# =========================================================
# BUILD
# =========================================================
  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.build_needed == 'true'
    runs-on: ubuntu-latest

    steps:

# -------------------------
# SDK
# -------------------------
    - uses: actions/checkout@v4
      with:
        repository: FUjr/QModem
        path: qmodem-source

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib \
          g++-multilib gettext git libncurses-dev libssl-dev python3 unzip wget zstd jq

    - name: SDK cache
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_DIR }}
        key: sdk-mvebu-24.10.4-v3

    - name: Download SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        wget -q "${{ env.SDK_URL }}"
        tar --zstd -xf "${{ env.SDK_TARBALL }}"

# -------------------------
# FEEDS
# -------------------------
    - name: Configure feeds
      run: |
        cd ${{ env.SDK_DIR }}

        cat > feeds.conf.default <<EOF
src-link qmodem ${{ github.workspace }}/qmodem-source
src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
EOF

        ./scripts/feeds update -a
        ./scripts/feeds install -a

        rm -rf feeds/packages/kernel
        rm -rf package/kernel

# -------------------------
# MINIMAL CONFIG (IMPORTANT FIX)
# -------------------------
    - name: Configure build
      run: |
        cd ${{ env.SDK_DIR }}

        cat > .config <<EOF
CONFIG_ALL=n
CONFIG_ALL_KMODS=n
CONFIG_DEVEL=y
EOF

        # ONLY OUR KMODS
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_q=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_f=m" >> .config
        echo "CONFIG_PACKAGE_kmod-qmi_wwan_s=m" >> .config
        echo "CONFIG_PACKAGE_kmod-pcie_mhi=m" >> .config

        # USERSPACE ONLY
        echo "CONFIG_PACKAGE_qmodem=m" >> .config
        echo "CONFIG_PACKAGE_qmodem_monitor=m" >> .config
        echo "CONFIG_PACKAGE_tom_modem=m" >> .config
        echo "CONFIG_PACKAGE_quectel-CM-5G-M=m" >> .config

        make defconfig

# -------------------------
# BUILD STRICT TARGETS ONLY
# -------------------------
    - name: Build ONLY selected packages
      run: |
        cd ${{ env.SDK_DIR }}

        make package/qmodem/compile V=s
        make package/qmodem_monitor/compile V=s
        make package/tom_modem/compile V=s
        make package/quectel-CM-5G-M/compile V=s

        make package/kmod-qmi_wwan_q/compile V=s
        make package/kmod-qmi_wwan_f/compile V=s
        make package/kmod-qmi_wwan_s/compile V=s
        make package/kmod-pcie_mhi/compile V=s

# -------------------------
# COLLECT ONLY OUR IPKS
# -------------------------
    - name: Collect IPKs
      run: |
        mkdir -p ipks

        find ${{ env.SDK_DIR }}/bin -name "qmodem*.ipk" -exec cp {} ipks/ \;
        find ${{ env.SDK_DIR }}/bin -name "kmod-qmi_wwan*.ipk" -exec cp {} ipks/ \;
        find ${{ env.SDK_DIR }}/bin -name "kmod-pcie_mhi*.ipk" -exec cp {} ipks/ \;

        ls -lh ipks

# -------------------------
# ARTIFACT
# -------------------------
    - uses: actions/upload-artifact@v4
      with:
        name: qmodem-ipks
        path: ipks/*.ipk
